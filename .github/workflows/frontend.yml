name: Frontend CI

on:
  pull_request:
    paths:
      - "Frontend/**"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main]
    paths:
      - "Frontend/**"
      - ".github/workflows/frontend.yml"

defaults:
  run:
    working-directory: Frontend

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: Frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: true
          PLAYWRIGHT_PORT: "4010"
          NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: Eventer_advance_bot
          TELEGRAM_BOT_USERNAME: Eventer_advance_bot
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:4001
      - run: pnpm build
