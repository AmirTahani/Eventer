# Production Nginx for Eventer.
# Apex + www serve the marketing homepage; app is the dashboard host; api is the backend.
#
# After copying to /etc/nginx/sites-available/eventer:
#   ln -sf /etc/nginx/sites-available/eventer /etc/nginx/sites-enabled/eventer
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d eventer.world -d www.eventer.world -d app.eventer.world -d api.eventer.world

server {
  listen 80;
  server_name eventer.world www.eventer.world app.eventer.world;

  location / {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 80;
  server_name api.eventer.world;

  location / {
    proxy_pass http://127.0.0.1:4001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
