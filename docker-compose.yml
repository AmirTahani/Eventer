services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: eventer
      POSTGRES_PASSWORD: e1c0cf434108bf3d672a9f9b40866ea74a1c31e0402b05527afd94d651093bcc
      POSTGRES_DB: events
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventer -d events"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Recommended prod/staging order:
  #   1) build images
  #   2) run `prisma migrate deploy` once against the target DB (CI job or one-shot)
  #   3) roll out api / bot / worker / web
  # Avoid N replicas all running migrate on boot. For a single-replica staging
  # shortcut you may override api command to:
  #   ./scripts/migrate-and-start.sh api

  api:
    build:
      context: ./Backend
    command: node dist/apps/api/main.js
    env_file: ./Backend/.env
    environment:
      DATABASE_URL: postgresql://eventer:e1c0cf434108bf3d672a9f9b40866ea74a1c31e0402b05527afd94d651093bcc@postgres:5432/events?schema=public
      REDIS_URL: redis://redis:6379
      # Login runs on eventer.world; dashboard may use app.eventer.world
      CORS_ORIGIN: ${CORS_ORIGIN:-https://eventer.world,https://www.eventer.world,https://app.eventer.world,https://admin.eventer.world,http://localhost:4000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:4001:4001"
    profiles: ["full"]

  bot:
    build:
      context: ./Backend
    command: node dist/apps/bot/main.js
    env_file: ./Backend/.env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://eventer:e1c0cf434108bf3d672a9f9b40866ea74a1c31e0402b05527afd94d651093bcc@postgres:5432/events?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["full"]
    
  worker:
    build:
      context: ./Backend
    command: node dist/apps/worker/main.js
    env_file: ./Backend/.env
    environment:
      DATABASE_URL: postgresql://eventer:e1c0cf434108bf3d672a9f9b40866ea74a1c31e0402b05527afd94d651093bcc@postgres:5432/events?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["full"]

  web:
    build:
      context: ./Frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api.eventer.world}
        NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-Eventer_advance_bot}
    env_file: ./Frontend/.env
    environment:
      NEXT_PUBLIC_API_BASE_URL: https://api.eventer.world
      # Runtime SSR for Telegram Login widget (avoids depending on /config CORS)
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-Eventer_advance_bot}
      NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-Eventer_advance_bot}
      HOSTNAME: "0.0.0.0"
      PORT: "4000"
    depends_on:
      - api
    ports:
      - "127.0.0.1:4000:4000"
    profiles: ["full"]

volumes:
  pgdata:
