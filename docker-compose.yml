services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: eventer
      POSTGRES_PASSWORD: eventer
      POSTGRES_DB: events
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventer -d events"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Recommended prod/staging order:
  #   1) build images
  #   2) run `prisma migrate deploy` once against the target DB (CI job or one-shot)
  #   3) roll out api / bot / worker / web
  # Avoid N replicas all running migrate on boot. For a single-replica staging
  # shortcut you may override api command to:
  #   ./scripts/migrate-and-start.sh api

  api:
    build:
      context: ./Backend
    command: node dist/apps/api/main.js
    env_file: ./Backend/.env
    environment:
      DATABASE_URL: postgresql://eventer:eventer@postgres:5432/events?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    profiles: ["full"]

  bot:
    build:
      context: ./Backend
    command: node dist/apps/bot/main.js
    env_file: ./Backend/.env
    environment:
      DATABASE_URL: postgresql://eventer:eventer@postgres:5432/events?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["full"]

  worker:
    build:
      context: ./Backend
    command: node dist/apps/worker/main.js
    env_file: ./Backend/.env
    environment:
      DATABASE_URL: postgresql://eventer:eventer@postgres:5432/events?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["full"]

  web:
    build:
      context: ./Frontend
    env_file: ./Frontend/.env
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000
    depends_on:
      - api
    ports:
      - "3001:3000"
    profiles: ["full"]

volumes:
  pgdata:
